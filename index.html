<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery 25</title><style>body{font-family:system-ui;background:#e8f3e7;color:#254b39;margin:0}main{max-width:1050px;margin:auto;padding:22px}h1{font-size:2.6rem}button,select{font:inherit;border:0;border-radius:12px;padding:12px;cursor:pointer}button{background:#477c5d;color:white}button:disabled{opacity:.4}.panel{background:#fffdf5;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 14px #2342}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.tile{aspect-ratio:1;background:linear-gradient(135deg,#a9784e,#74472d);font-size:clamp(12px,2vw,20px);color:white;border:3px solid #e5c69a}.tile.open{background:#d5e5d1;color:#244}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.options button{background:#e4f1e1;color:#264}.options button.selected{background:#4b815e;color:white}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#62796b}.hidden{display:none}.answer{font-size:2rem;font-weight:800}#bear{font-size:48px}#history{max-height:160px;overflow:auto}@media(max-width:600px){.options{grid-template-columns:1fr}.tile{padding:3px}.grid{gap:3px}}</style><main><header><h1>🐾 Mystery 25</h1><p>Discover the secret word together! — No AI, no login.</p></header><section id="setup" class="panel"><h2>New Round</h2><label>Difficulty <select id="difficulty"><option>Easy</option><option>Normal</option><option>Hard</option></select></label> <button onclick="startRound()">Start Game</button><p class="muted">Prototype: 50 words. Bear photographs can be added later without changing the carvings.</p></section><section id="game" class="hidden"><div class="panel bar"><strong id="status"></strong><span id="bear">🐻</span><button onclick="toggleHelp()">Japanese Help</button><button onclick="toggleHistory()">History</button></div><div class="panel"><div id="grid" class="grid"></div></div><div class="panel" id="interaction"><h2 id="cardtitle">Choose a card</h2><div id="cardcontent"></div></div><div class="panel bar"><button onclick="revealSecret()">Reveal Answer!</button><button onclick="giveUp()">Give Up</button><button onclick="finishGame()">Finish Game</button></div><div id="history" class="panel hidden"></div></section><section id="result" class="panel hidden"></section></main><script>
const words=[
['cat','猫','Animals','Mammal','Easy','is_living,is_animal,has_fur,is_pet'],['dog','犬','Animals','Mammal','Easy','is_living,is_animal,has_fur,is_pet,can_swim'],['penguin','ペンギン','Animals','Bird','Easy','is_living,is_animal,is_bird,has_feathers,can_swim,lives_cold'],['elephant','ゾウ','Animals','Mammal','Easy','is_living,is_animal,has_fur'],['butterfly','蝶','Animals','Insect','Easy','is_living,is_animal,can_fly'],['shark','サメ','Animals','Fish','Easy','is_living,is_animal,can_swim,lives_ocean'],['rabbit','ウサギ','Animals','Mammal','Easy','is_living,is_animal,has_fur,is_pet'],['owl','フクロウ','Animals','Bird','Easy','is_living,is_animal,is_bird,has_feathers,can_fly'],['whale','クジラ','Animals','Mammal','Easy','is_living,is_animal,can_swim,lives_ocean'],['horse','馬','Animals','Mammal','Easy','is_living,is_animal,has_fur'],
['apple','リンゴ','Food','Fruit','Easy','is_food,is_fruit,is_plant'],['banana','バナナ','Food','Fruit','Easy','is_food,is_fruit,is_plant'],['pizza','ピザ','Food','Meal','Easy','is_food,is_made'],['rice','米・ご飯','Food','Grain','Easy','is_food,is_plant'],['ice cream','アイスクリーム','Food','Dessert','Easy','is_food,is_cold'],['carrot','ニンジン','Food','Vegetable','Easy','is_food,is_plant'],['bread','パン','Food','Meal','Easy','is_food,is_made'],['cheese','チーズ','Food','Dairy','Easy','is_food'],['tea','お茶','Food','Drink','Easy','is_food,is_drink'],['strawberry','イチゴ','Food','Fruit','Easy','is_food,is_fruit,is_plant'],
['umbrella','傘','Objects','Tool','Easy','is_made,is_object,is_portable'],['bicycle','自転車','Objects','Transport','Easy','is_made,is_object,is_transport'],['clock','時計','Objects','Device','Easy','is_made,is_object'],['book','本','Objects','Media','Easy','is_made,is_object,is_portable'],['chair','椅子','Objects','Furniture','Easy','is_made,is_object'],['pencil','鉛筆','Objects','Tool','Easy','is_made,is_object,is_portable'],['camera','カメラ','Objects','Device','Easy','is_made,is_object,uses_electricity,is_portable'],['phone','電話','Objects','Device','Easy','is_made,is_object,uses_electricity,is_portable'],['key','鍵','Objects','Tool','Easy','is_made,is_object,is_portable'],['backpack','リュック','Objects','Bag','Easy','is_made,is_object,is_portable'],
['mountain','山','Nature','Landform','Easy','is_nature'],['river','川','Nature','Water','Easy','is_nature'],['snow','雪','Nature','Weather','Easy','is_nature,is_cold'],['rain','雨','Nature','Weather','Easy','is_nature'],['flower','花','Nature','Plant','Easy','is_living,is_nature,is_plant'],['tree','木','Nature','Plant','Easy','is_living,is_nature,is_plant'],['moon','月','Nature','Space','Easy','is_nature'],['ocean','海','Nature','Water','Easy','is_nature,lives_ocean'],['volcano','火山','Nature','Landform','Easy','is_nature'],['rainbow','虹','Nature','Weather','Easy','is_nature'],
['library','図書館','Places','Building','Easy','is_place,is_made,is_indoors'],['school','学校','Places','Building','Easy','is_place,is_made,is_indoors'],['hospital','病院','Places','Building','Easy','is_place,is_made,is_indoors'],['park','公園','Places','Outdoor','Easy','is_place,is_made'],['airport','空港','Places','Transport','Easy','is_place,is_made'],['restaurant','レストラン','Places','Building','Easy','is_place,is_made,is_indoors'],['beach','浜辺','Places','Outdoor','Easy','is_place,is_nature'],['museum','博物館','Places','Building','Easy','is_place,is_made,is_indoors'],['bridge','橋','Places','Structure','Easy','is_place,is_made'],['farm','農場','Places','Outdoor','Easy','is_place,is_made']
].map((x,i)=>({id:i,en:x[0],ja:x[1],category:x[2],subcategory:x[3],difficulty:x[4],features:x[5].split(',')}));
const questions=[['Is it a living thing?','生き物ですか？','is_living'],['Is it an animal?','動物ですか？','is_animal'],['Is it a bird?','鳥ですか？','is_bird'],['Does it have fur?','毛皮がありますか？','has_fur'],['Does it have feathers?','羽毛がありますか？','has_feathers'],['Can it fly?','飛べますか？','can_fly'],['Can it swim?','泳げますか？','can_swim'],['Is it commonly kept as a pet?','一般的にペットとして飼われますか？','is_pet'],['Does it live in the ocean?','海に生息しますか？','lives_ocean'],['Is it associated with cold places?','寒い場所と関係がありますか？','lives_cold'],['Is it food or a drink?','食べ物か飲み物ですか？','is_food'],['Is it a fruit?','果物ですか？','is_fruit'],['Is it a drink?','飲み物ですか？','is_drink'],['Is it served cold?','冷たい状態で出されますか？','is_cold'],['Is it a plant or made from a plant?','植物、または植物由来ですか？','is_plant'],['Is it made by people?','人が作ったものですか？','is_made'],['Is it an everyday object?','日用品ですか？','is_object'],['Can you carry it easily?','簡単に持ち運べますか？','is_portable'],['Does it use electricity?','電気を使いますか？','uses_electricity'],['Is it used for transportation?','移動に使いますか？','is_transport'],['Is it part of the natural world?','自然界のものですか？','is_nature'],['Is it a place?','場所ですか？','is_place'],['Is it usually indoors?','通常屋内ですか？','is_indoors']].map((q,i)=>({id:i,en:q[0],ja:q[1],feature:q[2]}));
let state=null,help=false,total=0,rounds=0,historyOpen=false;
const $=id=>document.getElementById(id),shuffle=a=>a.sort(()=>Math.random()-.5),sample=a=>a[Math.floor(Math.random()*a.length)];
function startRound(){const difficulty=$('difficulty').value;const pool=words.filter(w=>w.difficulty===difficulty);if(!pool.length){alert('This difficulty will be added in the full version. Please choose Easy.');return}const secret=sample(pool);let deck=[...Array(18).fill('Normal'),...Array(3).fill('Hint'),...Array(2).fill('Double'),...Array(2).fill('Category')];shuffle(deck);state={secret,deck,opened:new Set(),history:[],asked:new Set(),remaining:[...words],selected:null,question:null,questionCount:0,score:0,roundOver:false,categoryCount:0,hintCount:0};$('setup').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){if(!state)return;$('status').textContent=`Cards ${state.opened.size}/25 · Total ${total} pts · Remaining candidates ${state.remaining.length}`;$('grid').innerHTML='';state.deck.forEach((type,i)=>{const b=document.createElement('button');b.className='tile '+(state.opened.has(i)?'open':'');b.textContent=state.opened.has(i)?type:'🐾';b.disabled=state.opened.has(i)||state.selected!==null||state.roundOver;b.onclick=()=>openCard(i);$('grid').appendChild(b)});$('history').innerHTML='<h3>History</h3>'+state.history.map(x=>'<p>'+x+'</p>').join('');$('history').classList.toggle('hidden',!historyOpen)}
function toggleHelp(){help=!help;if(state?.selected!==null)showCard()}function toggleHistory(){historyOpen=!historyOpen;render()}
function openCard(i){state.selected=i;state.opened.add(i);state.questionCount=0;state.question=null;showCard();render()}
function answer(q){return state.secret.features.includes(q.feature)?'Yes!':'No!'}
function rankedQuestions(){const valid=questions.filter(q=>!state.asked.has(q.id));const ranked=valid.map(q=>{let yes=state.remaining.filter(w=>w.features.includes(q.feature)).length;return {q,score:Math.min(yes,state.remaining.length-yes)+Math.random()*1.5}}).sort((a,b)=>b.score-a.score);let picks=ranked.slice(0,2).map(x=>x.q);const rest=ranked.slice(2);if(rest.length)picks.push(rest[0].q);if(rest.length>1)picks.push(sample(rest.slice(1)).q);return shuffle(picks)}
function showCard(){const type=state.deck[state.selected];$('cardtitle').textContent=type+' Card';const el=$('cardcontent');if(type==='Normal'||type==='Double'){if(!state.question){let opts=rankedQuestions();el.innerHTML='<p>Choose a question and read it aloud:</p><div class="options" id="opts"></div>';opts.forEach(q=>{let b=document.createElement('button');b.textContent=q.en+(help?' — '+q.ja:'');b.onclick=()=>{state.question=q;showCard()};$('opts').appendChild(b)});if(!opts.length)el.innerHTML='No unused questions remain. <button onclick="nextCard()">Next Card</button>'}else{el.innerHTML='<h2>'+state.question.en+'</h2>'+(help?'<p>'+state.question.ja+'</p>':'')+'<button id="check" onclick="checkAnswer()">Check Answer</button>'}}else if(type==='Hint'){const hints=[`It belongs to the category ${state.secret.category}.`,`Its more specific category is ${state.secret.subcategory}.`,`Its English name starts with “${state.secret.en[0].toUpperCase()}”.`];const h=hints[Math.min(state.hintCount,2)];el.innerHTML='<p class="answer">'+h+'</p>'+(help?'<p>ヒント：'+state.secret.ja+'を推理しよう</p>':'')+'<button onclick="nextCard()">Next Card</button>';state.hintCount++;state.history.push('Hint → '+h)}else if(type==='Category'){const h=state.categoryCount===0?state.secret.category:state.secret.subcategory;el.innerHTML='<p class="answer">'+h+'</p><button onclick="nextCard()">Next Card</button>';state.categoryCount++;state.history.push('Category → '+h);state.remaining=state.remaining.filter(w=>state.categoryCount===1?w.category===state.secret.category:w.subcategory===state.secret.subcategory)} }
function checkAnswer(){const b=$('check');b.disabled=true;b.textContent='Checking…';setTimeout(()=>{const q=state.question;const a=answer(q);state.asked.add(q.id);state.history.push(q.en+' → '+a);state.remaining=state.remaining.filter(w=>w.features.includes(q.feature)===state.secret.features.includes(q.feature));state.questionCount++;$('cardcontent').innerHTML='<p class="answer">'+a+'</p>'+(state.deck[state.selected]==='Double'&&state.questionCount===1?'<button onclick="anotherQuestion()">Second Question</button>':'<button onclick="nextCard()">Next Card</button>');render()},900)}
function anotherQuestion(){state.question=null;showCard()}function nextCard(){state.selected=null;state.question=null;$('cardtitle').textContent='Choose a card';$('cardcontent').innerHTML='Discuss together, then open another card.';render();if(state.opened.size===25)revealSecret()}
function revealSecret(){if(!state||state.roundOver)return;if(!confirm('Reveal the secret word?'))return;const w=state.secret;$('cardtitle').textContent='The secret word is…';$('cardcontent').innerHTML=`<h1>${w.en}</h1>${help?'<p>'+w.ja+'</p>':''}<p>Did your group guess correctly?</p><button onclick="endRound(true)">Correct!</button> <button onclick="endRound(false)">Incorrect</button>`}
function giveUp(){if(confirm('Give up this round?'))endRound(false)}function endRound(correct){if(state.roundOver)return;state.roundOver=true;rounds++;const factor={Easy:1,Normal:1.5,Hard:2}[$('difficulty').value];const earned=correct?Math.round((26-state.opened.size)*10*factor):0;total+=earned;$('game').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<h2>${correct?'🎉 Correct!':'Round Over'}</h2><h1>${state.secret.en}</h1><p>${state.secret.ja}</p><h2>+${earned} points</h2><p>Total: ${total} points · Rounds: ${rounds}</p><button onclick="newRound()">Next Round</button> <button onclick="finishGame()">Finish Game</button>`}
function newRound(){$('result').classList.add('hidden');$('setup').classList.remove('hidden');state=null}function finishGame(){$('game').classList.add('hidden');$('setup').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<h1>🎉 Final Results</h1><h2>${total} points</h2><p>${rounds} completed rounds</p><button onclick="resetGame()">Play Again</button>`}function resetGame(){total=0;rounds=0;state=null;$('result').classList.add('hidden');$('setup').classList.remove('hidden')}
</script></html>
