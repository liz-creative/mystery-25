:root{font-family:system-ui,-apple-system,sans-serif;color:#254b39;background:#e8f3e7}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:20px}h1{font-size:2.4rem;margin-bottom:4px}.panel{background:#fffdf5;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #2342}button,select,input{font:inherit;border-radius:10px;padding:11px}button{border:0;background:#477c5d;color:white;cursor:pointer}button:hover:not(:disabled){filter:brightness(1.1)}button:disabled{opacity:.45;cursor:default}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tile{aspect-ratio:1;background:linear-gradient(135deg,#a9784e,#74472d);color:#fff;border:3px solid #e5c69a;font-size:clamp(13px,2vw,20px);min-width:0}.tile.open{background:#d5e5d1;color:#244}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.options button{background:#e4f1e1;color:#264;text-align:left;min-height:64px}.hidden{display:none!important}.muted{color:#62796b}.answer{font-size:2rem;font-weight:800}.question{font-size:1.45rem;font-weight:700}.guessinput{border:2px solid #b1cdb6;width:min(100%,420px)}.notice{padding:10px;background:#eaf3e7;border-radius:10px}.small{font-size:.85rem}#history{max-height:240px;overflow:auto}#interaction{scroll-margin-top:12px}#status{font-size:1rem}@media(max-width:650px){main{padding:10px}.panel{padding:13px}.options{grid-template-columns:1fr}.grid{gap:4px}.tile{padding:2px;border-width:2px}}
</style></head><body><main><header><h1>🐾 Mystery 25</h1><p>Discover the secret word together! — No AI, no login.</p></header><section id="setup" class="panel"><h2>New Round</h2><label>Difficulty <select id="difficulty"><option>Easy</option><option>Normal</option><option>Hard</option></select></label> <button id="start">Start Game</button><p class="muted small">Version 2 test: 50 Easy words. Normal and Hard word banks are coming later.</p></section><section id="game" class="hidden"><div class="panel bar"><strong id="status"></strong><span style="font-size:42px" aria-hidden="true">🐻</span><button id="help">Japanese Help: Off</button><button id="historyButton">History</button></div><div class="panel"><div id="grid" class="grid"></div></div><div class="panel" id="interaction"><h2 id="cardtitle">Choose a card</h2><div id="cardcontent">Open any paw-print card to begin.</div></div><div class="panel bar"><button id="guess">Make a Guess!</button><button id="giveup">Give Up</button><button id="finish">Finish Game</button></div><div id="history" class="panel hidden"></div></section><section id="result" class="panel hidden"></section></main><script>
'use strict';
const raw=[
['cat','猫','Animals','Mammal','is_living,is_animal,has_fur,is_pet','It often purrs.','It has whiskers.'],['dog','犬','Animals','Mammal','is_living,is_animal,has_fur,is_pet,can_swim','It has a strong sense of smell.','It often barks.'],['penguin','ペンギン','Animals','Bird','is_living,is_animal,is_bird,has_feathers,can_swim,lives_cold','It has black and white feathers.','It cannot fly but swims well.'],['elephant','ゾウ','Animals','Mammal','is_living,is_animal,has_fur','It has very large ears.','It uses a long trunk.'],['butterfly','蝶','Animals','Insect','is_living,is_animal,can_fly','It changes form as it grows.','Its wings are often colorful.'],['shark','サメ','Animals','Fish','is_living,is_animal,can_swim,lives_ocean','It has several rows of teeth.','It is a powerful ocean predator.'],['rabbit','ウサギ','Animals','Mammal','is_living,is_animal,has_fur,is_pet','It has long ears.','It often hops.'],['owl','フクロウ','Animals','Bird','is_living,is_animal,is_bird,has_feathers,can_fly','It can turn its head far around.','It often hunts at night.'],['whale','クジラ','Animals','Mammal','is_living,is_animal,can_swim,lives_ocean','It breathes air through a blowhole.','It is an enormous sea mammal.'],['horse','馬','Animals','Mammal','is_living,is_animal,has_fur','People sometimes ride it.','It has hooves and a mane.'],
['apple','リンゴ','Food','Fruit','is_food,is_fruit,is_plant','It grows on trees.','It is often red or green.'],['banana','バナナ','Food','Fruit','is_food,is_fruit,is_plant','It grows in bunches.','It has a yellow peel when ripe.'],['pizza','ピザ','Food','Meal','is_food,is_made','It is usually baked.','It often has cheese and tomato sauce.'],['rice','米・ご飯','Food','Grain','is_food,is_plant','It is a staple food in Japan.','Its grains are often white when cooked.'],['ice cream','アイスクリーム','Food','Dessert','is_food,is_cold','It melts in warm weather.','It is often served in a cone.'],['carrot','ニンジン','Food','Vegetable','is_food,is_plant','It grows underground.','It is often orange.'],['bread','パン','Food','Meal','is_food,is_made','It is made from dough.','People often toast it.'],['cheese','チーズ','Food','Dairy','is_food','It is made from milk.','It can be sliced or grated.'],['tea','お茶','Food','Drink','is_food,is_drink','It is made by steeping leaves.','People drink it hot or cold.'],['strawberry','イチゴ','Food','Fruit','is_food,is_fruit,is_plant','It has tiny seeds on the outside.','It is usually red when ripe.'],
['umbrella','傘','Objects','Tool','is_made,is_object,is_portable','You open it when needed.','It helps keep you dry in the rain.'],['bicycle','自転車','Objects','Transport','is_made,is_object,is_transport','It has pedals.','It usually has two wheels.'],['clock','時計','Objects','Device','is_made,is_object','It may hang on a wall.','It shows the time.'],['book','本','Objects','Media','is_made,is_object,is_portable','It has pages.','You can read it.'],['chair','椅子','Objects','Furniture','is_made,is_object','It often has four legs.','You sit on it.'],['pencil','鉛筆','Objects','Tool','is_made,is_object,is_portable','It can become shorter with use.','You write with graphite.'],['camera','カメラ','Objects','Device','is_made,is_object,uses_electricity,is_portable','It has a lens.','You use it to take photographs.'],['phone','電話','Objects','Device','is_made,is_object,uses_electricity,is_portable','It can ring.','You use it to call someone.'],['key','鍵','Objects','Tool','is_made,is_object,is_portable','It is often made of metal.','You use it to unlock a door.'],['backpack','リュック','Objects','Bag','is_made,is_object,is_portable','It has shoulder straps.','You carry it on your back.'],
['mountain','山','Nature','Landform','is_nature','It rises above the surrounding land.','People sometimes climb it.'],['river','川','Nature','Water','is_nature','It flows downhill.','It may empty into the sea.'],['snow','雪','Nature','Weather','is_nature,is_cold','It falls from clouds in winter.','It is made of ice crystals.'],['rain','雨','Nature','Weather','is_nature','It falls from clouds.','It makes the ground wet.'],['flower','花','Nature','Plant','is_living,is_nature,is_plant','It often has petals.','Bees may visit it.'],['tree','木','Nature','Plant','is_living,is_nature,is_plant','It often has a trunk.','It grows branches and leaves.'],['moon','月','Nature','Space','is_nature','It changes its visible shape over the month.','It orbits Earth.'],['ocean','海','Nature','Water','is_nature','It covers much of Earth.','Its water is salty.'],['volcano','火山','Nature','Landform','is_nature','It may release ash.','Lava can erupt from it.'],['rainbow','虹','Nature','Weather','is_nature','It appears when sunlight meets water droplets.','It has bands of different colors.'],
['library','図書館','Places','Building','is_place,is_made,is_indoors','People borrow books here.','It is often a quiet place to read.'],['school','学校','Places','Building','is_place,is_made,is_indoors','Students attend classes here.','Teachers work here.'],['hospital','病院','Places','Building','is_place,is_made,is_indoors','Doctors and nurses work here.','People receive medical care here.'],['park','公園','Places','Outdoor','is_place,is_made','It often has trees and benches.','People go here to relax or play.'],['airport','空港','Places','Transport','is_place,is_made','It has runways.','Airplanes take off and land here.'],['restaurant','レストラン','Places','Building','is_place,is_made,is_indoors','It has menus.','People pay to eat meals here.'],['beach','浜辺','Places','Outdoor','is_place,is_nature','It often has sand.','People go here to swim or enjoy the sea.'],['museum','博物館','Places','Building','is_place,is_made,is_indoors','It displays collections and exhibits.','People go here to learn about history or art.'],['bridge','橋','Places','Structure','is_place,is_made','It crosses a river or road.','People or vehicles travel over it.'],['farm','農場','Places','Outdoor','is_place,is_made','Crops or animals are raised here.','Farmers work here.']
];
const words=raw.map((x,id)=>({id,en:x[0],ja:x[1],category:x[2],subcategory:x[3],features:new Set(x[4].split(',')),hints:[x[5],x[6]]}));
const qraw=[['Is it a living thing?','生き物ですか？','is_living'],['Is it an animal?','動物ですか？','is_animal'],['Is it a bird?','鳥ですか？','is_bird'],['Does it have fur?','毛がありますか？','has_fur'],['Does it have feathers?','羽毛がありますか？','has_feathers'],['Can it fly?','飛べますか？','can_fly'],['Can it swim?','泳げますか？','can_swim'],['Is it commonly kept as a pet?','ペットとしてよく飼われますか？','is_pet'],['Does it live in the ocean?','海に生息していますか？','lives_ocean'],['Is it associated with cold places?','寒い場所と関係がありますか？','lives_cold'],['Is it food or a drink?','飲食物ですか？','is_food'],['Is it a fruit?','果物ですか？','is_fruit'],['Is it a drink?','飲み物ですか？','is_drink'],['Is it usually served cold?','通常冷たい状態で出されますか？','is_cold'],['Is it a plant or made from a plant?','植物か植物由来ですか？','is_plant'],['Is it made by people?','人が作ったものですか？','is_made'],['Is it an everyday object?','日用品ですか？','is_object'],['Can you carry it easily?','簡単に持ち運べますか？','is_portable'],['Does it use electricity?','電気を使いますか？','uses_electricity'],['Is it used for transportation?','移動に使いますか？','is_transport'],['Is it part of the natural world?','自然界のものですか？','is_nature'],['Is it a place?','場所ですか？','is_place'],['Is it usually indoors?','通常屋内ですか？','is_indoors']];
const questions=qraw.map((x,id)=>({id,en:x[0],ja:x[1],feature:x[2]}));
const $=id=>document.getElementById(id),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},pick=a=>a[Math.floor(Math.random()*a.length)];let game=null,total=0,rounds=[],usedWords=new Set(),help=false,historyOpen=false;
function startRound(){if($('difficulty').value!=='Easy'){alert('Normal and Hard word lists are not available in this 50-word test. Please choose Easy.');return}let pool=words.filter(w=>!usedWords.has(w.id));if(!pool.length){usedWords.clear();pool=[...words]}const secret=pick(pool);usedWords.add(secret.id);game={secret,deck:shuffle([...Array(21).fill('Normal'),...Array(3).fill('Hint'),'Category']),opened:new Set(),remaining:[...words],asked:new Set(),history:[],active:null,question:null,stage:'select',hintCount:0,categoryStage:0,over:false};$('setup').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');$('cardtitle').textContent='Choose a card';$('cardcontent').textContent='Open any paw-print card to begin.';render()}
function render(){if(!game)return;$('status').textContent=`Cards ${game.opened.size}/25 · Total ${total} pts · Remaining candidates ${game.remaining.length}`;$('grid').replaceChildren();game.deck.forEach((type,i)=>{let b=document.createElement('button');b.className='tile'+(game.opened.has(i)?' open':'');b.textContent=game.opened.has(i)?type:'🐾';b.disabled=game.opened.has(i)||game.active!==null||game.over||game.stage==='guess'||game.stage==='reveal';b.addEventListener('click',()=>openCard(i));$('grid').append(b)});$('history').replaceChildren();let h=document.createElement('h3');h.textContent='History';$('history').append(h);for(let entry of game.history){let p=document.createElement('p');p.textContent=entry;$('history').append(p)}$('history').classList.toggle('hidden',!historyOpen)}
function scrollToInteraction(){setTimeout(()=>$('interaction').scrollIntoView({behavior:'smooth',block:'start'}),60)}
function openCard(i){game.active=i;game.opened.add(i);game.question=null;game.stage='card';showCard();render();scrollToInteraction()}
function rankedQuestions(){const remaining=questions.filter(q=>!game.asked.has(q.id));const scored=remaining.map(q=>{const yes=game.remaining.filter(w=>w.features.has(q.feature)).length;return {q,score:Math.min(yes,game.remaining.length-yes)}}).sort((a,b)=>b.score-a.score);const high=scored.slice(0,Math.min(3,scored.length)).map(x=>x.q);const others=scored.slice(high.length);if(others.length)high.push(pick(others).q);return shuffle(high)}
function showCard(){if(game.active===null)return;const type=game.deck[game.active];$('cardtitle').textContent=type+' Card';const box=$('cardcontent');box.replaceChildren();if(type==='Normal'){if(!game.question){let p=document.createElement('p');p.textContent='Choose a question and read it aloud:';box.append(p);let opts=document.createElement('div');opts.className='options';for(let q of rankedQuestions()){let b=document.createElement('button');b.textContent=q.en+(help?' — '+q.ja:'');b.onclick=()=>{game.question=q;showCard()};opts.append(b)}box.append(opts);if(!opts.children.length)appendButton(box,'No questions left — Next Card',nextCard)}else{let h=document.createElement('p');h.className='question';h.textContent=game.question.en;box.append(h);if(help){let j=document.createElement('p');j.textContent=game.question.ja;box.append(j)}appendButton(box,'Check Answer',checkAnswer)}}else if(type==='Hint'){let w=game.secret;const options=[...w.hints,`Its English name starts with “${w.en[0].toUpperCase()}”.`];let clue=options[Math.min(game.hintCount,2)];game.hintCount++;game.history.push('Hint → '+clue);let p=document.createElement('p');p.className='answer';p.textContent=clue;box.append(p);appendButton(box,'Next Card',nextCard)}else{game.categoryStage=1;let p=document.createElement('p');p.className='answer';p.textContent=game.secret.category;box.append(p);game.history.push('Category → '+game.secret.category);game.remaining=game.remaining.filter(w=>w.category===game.secret.category);appendButton(box,'More Specific Category',showSubcategory);box.append(' ');appendButton(box,'Next Card',nextCard)}}
function showSubcategory(){if(game.categoryStage!==1)return;game.categoryStage=2;let sub=game.secret.subcategory;game.history.push('Subcategory → '+sub);game.remaining=game.remaining.filter(w=>w.subcategory===sub);$('cardcontent').replaceChildren();let p=document.createElement('p');p.className='answer';p.textContent=game.secret.category+' → '+sub;$('cardcontent').append(p);appendButton($('cardcontent'),'Next Card',nextCard);render()}
function appendButton(parent,label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;parent.append(b);return b}
function checkAnswer(){const q=game.question;if(!q)return;const yes=game.secret.features.has(q.feature);game.asked.add(q.id);game.remaining=game.remaining.filter(w=>w.features.has(q.feature)===yes);game.history.push(q.en+' → '+(yes?'Yes!':'No!'));game.stage='answered';let box=$('cardcontent');box.replaceChildren();let question=document.createElement('p');question.className='question';question.textContent=q.en;box.append(question);if(help){let j=document.createElement('p');j.textContent=q.ja;box.append(j)}let p=document.createElement('p');p.className='answer';p.textContent=yes?'Yes!':'No!';box.append(p);appendButton(box,'Next Card',nextCard);render()}
function nextCard(){game.active=null;game.question=null;game.stage='select';$('cardtitle').textContent='Choose a card';$('cardcontent').textContent='Discuss together, then open another card.';render();if(game.opened.size===25)openGuess()}
function openGuess(){if(!game||game.over)return;game.active=null;game.stage='guess';$('cardtitle').textContent='Ready to Guess?';$('cardcontent').replaceChildren();let p=document.createElement('p');p.textContent='Discuss together and enter the secret word in English.';$('cardcontent').append(p);let input=document.createElement('input');input.id='guessInput';input.className='guessinput';input.placeholder='Type your answer...';input.autocomplete='off';input.setAttribute('aria-label','English answer');$('cardcontent').append(input,' ');appendButton($('cardcontent'),'Submit Answer',submitGuess);input.addEventListener('keydown',e=>{if(e.key==='Enter')submitGuess()});let note=document.createElement('p');note.className='muted';note.textContent='You may guess before all 25 cards are opened.';$('cardcontent').append(note);render();scrollToInteraction();input.focus()}
function submitGuess(){let input=$('guessInput');if(!input)return;const guess=input.value.trim();if(!guess){input.focus();return}if(!confirm(`Is “${guess}” your final answer?`))return;const w=game.secret;const norm=s=>s.toLowerCase().normalize('NFKC').replace(/[^a-z0-9]/g,'');const aliases={bicycle:['bike'],phone:['telephone','cell phone','mobile phone'],backpack:['rucksack'],icecream:['ice-cream']};const correct=[w.en,...(aliases[w.en.replace(/\s/g,'')]||[]),...(aliases[w.en]||[])].some(a=>norm(a)===norm(guess));game.stage='reveal';$('cardtitle').textContent='The secret word is…';$('cardcontent').replaceChildren();let h=document.createElement('h1');h.textContent=w.en;let p=document.createElement('p');p.textContent='Your answer: '+guess;let verdict=document.createElement('h2');verdict.textContent=correct?'🎉 Correct!':'Incorrect';$('cardcontent').append(h,p,verdict);appendButton($('cardcontent'),'See Round Results',()=>endRound(correct));render()}
function giveUp(){if(game&&!game.over&&confirm('Give up this round?'))endRound(false)}
function endRound(correct){if(game.over)return;game.over=true;const earned=correct?(26-game.opened.size)*10:0;total+=earned;rounds.push({word:game.secret.en,correct,earned,cards:game.opened.size});$('game').classList.add('hidden');$('result').classList.remove('hidden');$('result').replaceChildren();let h=document.createElement('h2');h.textContent=correct?'🎉 Correct!':'Round Over';let w=document.createElement('h1');w.textContent=game.secret.en;let p=document.createElement('p');p.textContent=game.secret.ja+' · +'+earned+' points · Total: '+total+' points';$('result').append(h,w,p);appendButton($('result'),'Next Round',newRound);$('result').append(' ');appendButton($('result'),'Finish Game',finishGame);window.scrollTo({top:0,behavior:'smooth'})}
function newRound(){game=null;$('result').classList.add('hidden');$('setup').classList.remove('hidden')}
function finishGame(){if(game&&!game.over&&game.stage!=='reveal'){if(!confirm('Finish the game without scoring this round?'))return}let result=$('result');$('game').classList.add('hidden');$('setup').classList.add('hidden');result.classList.remove('hidden');result.replaceChildren();let h=document.createElement('h1');h.textContent='🎉 Final Results';let p=document.createElement('p');p.textContent=`${total} points · ${rounds.length} completed rounds · ${rounds.filter(r=>r.correct).length} correct`;result.append(h,p);let best=document.createElement('p');best.textContent='Best round: '+Math.max(0,...rounds.map(r=>r.earned))+' points';result.append(best);for(let r of rounds){let line=document.createElement('p');line.textContent=`${r.word} — ${r.correct?'Correct':'Incorrect'} — ${r.earned} points (${r.cards} cards)`;result.append(line)}appendButton(result,'Play Again',()=>{game=null;total=0;rounds=[];usedWords.clear();result.classList.add('hidden');$('setup').classList.remove('hidden')});window.scrollTo(0,0)}
$('start').onclick=startRound;$('help').onclick=()=>{help=!help;$('help').textContent='Japanese Help: '+(help?'On':'Off');if(game&&game.active!==null&&game.stage==='card'&&game.deck[game.active]==='Normal')showCard()};$('historyButton').onclick=()=>{historyOpen=!historyOpen;render()};$('guess').onclick=openGuess;$('giveup').onclick=giveUp;$('finish').onclick=finishGame;
</script></body></html>
